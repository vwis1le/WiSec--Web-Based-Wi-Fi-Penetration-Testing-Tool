<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiSec - Select your desired module</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; min-height: 100vh; color: #E6F1FB; }
        .navbar { background-color: #0C447C; padding: 12px 24px; }
        .navbar-brand { color: #E6F1FB; font-weight: 500; font-size: 16px; }
        .nav-link { color: #85B7EB; font-size: 14px; }
        .nav-link:hover { color: #E6F1FB; }
        .main-content { padding: 32px; }
        .page-title { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
        .page-subtitle { font-size: 13px; color: #484f58; margin-bottom: 24px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 8px 0; margin-bottom: 24px; }
        .module-row { display: flex; align-items: flex-start; gap: 16px; padding: 16px 20px; border-bottom: 1px solid #30363d; cursor: pointer; }
        .module-row:last-child { border-bottom: none; }
        .module-row:hover { background-color: #1c2128; }
        .module-checkbox { width: 18px; height: 18px; margin-top: 2px; accent-color: #185FA5; cursor: pointer; flex-shrink: 0; }
        .module-info { flex: 1; }
        .module-name { font-size: 14px; font-weight: 500; color: #E6F1FB; margin-bottom: 4px; }
        .module-desc { font-size: 12px; color: #484f58; }
        .module-tool { font-size: 11px; color: #85B7EB; margin-top: 4px; }
        .badge-high { background-color: #A32D2D; color: #FCEBEB; padding: 2px 8px; border-radius: 20px; font-size: 10px; }
        .badge-medium { background-color: #854F0B; color: #FAEEDA; padding: 2px 8px; border-radius: 20px; font-size: 10px; }
        .btn-run { background-color: #185FA5; color: #E6F1FB; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500; }
        .btn-run:hover { background-color: #0C447C; color: #E6F1FB; }
        .btn-run:disabled { background-color: #30363d; color: #484f58; cursor: not-allowed; }
        .selected-count { font-size: 13px; color: #484f58; text-align: center; margin-top: 12px; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar d-flex justify-content-between align-items-center">
        <span class="navbar-brand">WiSec</span>
        <div class="d-flex gap-3">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="#" class="nav-link">New Scan</a>
            <a href="/logout" class="nav-link">Logout</a>
        </div>
    </nav>

    <div class="main-content">
        <p class="page-title">Select testing modules</p>
        <p class="page-subtitle">Choose one or more modules to run against the target network</p>

        <form method="POST" action="/modules">
            <div class="card" style="padding: 16px 20px; margin-bottom: 16px;">
                <label for="target_ip" style="display:block; margin-bottom:6px; font-size:13px; color:#85B7EB;">
                    Target network to be tested
                </label>
                <input type="text" name="target_ip" id="target_ip"
                       value="{{ suggested_network }}"
                       style="width:100%; padding:10px; border-radius:6px; border:1px solid #30363d; background-color:#0d1117; color:#E6F1FB; font-size:14px;">
            </div>
            <div class="card">
                <!-- Module 1 -->
                <label class="module-row">
                    <input type="checkbox" name="modules" value="network_scan" class="module-checkbox" id="m1">
                    <div class="module-info">
                        <div class="d-flex align-items-center gap-2">
                            <span class="module-name">Network scan</span>
                            <span class="badge-medium">Medium</span>
                        </div>
                        <div class="module-desc">Discovers all active devices and open ports on the target network</div>
                        <div class="module-tool">Tool: Nmap</div>
                    </div>
                </label>

                <!-- Module 2 -->
                <label class="module-row">
                    <input type="checkbox" name="modules" value="wpa2_crack" class="module-checkbox" id="m2">
                    <div class="module-info">
                        <div class="d-flex align-items-center gap-2">
                            <span class="module-name">WPA2 cracking</span>
                            <span class="badge-high">High</span>
                        </div>
                        <div class="module-desc">Captures WPA2 handshake and attempts dictionary-based password recovery</div>
                        <div class="module-tool">Tool: Aircrack-ng</div>
                    </div>
                </label>

                <!-- Module 3 -->
                <label class="module-row">
                    <input type="checkbox" name="modules" value="deauth" class="module-checkbox" id="m3">
                    <div class="module-info">
                        <div class="d-flex align-items-center gap-2">
                            <span class="module-name">Deauthentication</span>
                            <span class="badge-high">High</span>
                        </div>
                        <div class="module-desc">Sends forged deauthentication packets to disconnect devices from the network</div>
                        <div class="module-tool">Tool: Wifite</div>
                    </div>
                </label>

                <!-- Module 4 -->
                <label class="module-row">
                    <input type="checkbox" name="modules" value="evil_twin" class="module-checkbox" id="m4">
                    <div class="module-info">
                        <div class="d-flex align-items-center gap-2">
                            <span class="module-name">Evil twin simulation</span>
                            <span class="badge-high">High</span>
                        </div>
                        <div class="module-desc">Creates a rogue access point impersonating the target network</div>
                        <div class="module-tool">Tool: Hostapd</div>
                    </div>
                </label>
            </div>

            <button type="submit" class="btn-run" id="runBtn" disabled>Run selected modules →</button>
            <p class="selected-count" id="selectedCount">No modules selected</p>
        </form>
    </div>

    <script>
        const checkboxes = document.querySelectorAll('.module-checkbox');
        const runBtn = document.getElementById('runBtn');
        const selectedCount = document.getElementById('selectedCount');

        checkboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                const selected = document.querySelectorAll('.module-checkbox:checked').length;
                runBtn.disabled = selected === 0;
                selectedCount.textContent = selected === 0 
                    ? 'No modules selected' 
                    : `${selected} module${selected > 1 ? 's' : ''} selected`;
            });
        });
    </script>
</body>
</html>
